<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Anggota Kelompok 13: Chika Dena (Project Manager), M. Firdausyah, Nazwa Dara Musyaraf, dan Irma Suraya">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d0a10"/>
      <stop offset="1" stop-color="#b3141b"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="2" fill="#ffe3a0"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2e0204" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="26"/></clipPath>
    <path id="spark" d="M0,-14 C2,-3.5 3.5,-2 14,0 C3.5,2 2,3.5 0,14 C-2,3.5 -3.5,2 -14,0 C-3.5,-2 -2,-3.5 0,-14Z"/>
  </defs>

  <style>
    .card { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .c1 { animation-delay: .1s; } .c2 { animation-delay: .3s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .7s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    .b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; } .b4 { animation-delay: 1.5s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .tw { animation: tw 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .8s; } .d2 { animation-delay: 1.8s; }
    @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: .95; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .card, .bob, .tw { animation: none; } }
  </style>

  <g clip-path="url(#frame)" font-family="Georgia, 'Times New Roman', serif">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#dots)" opacity="0.1"/>
    <rect x="14" y="14" width="1172" height="402" rx="18" fill="none" stroke="#ffcf3d" stroke-opacity="0.5" stroke-width="1.5"/>

    <g fill="#f6c453">
      <use href="#spark" class="tw" transform="translate(600 125)"/>
      <use href="#spark" class="tw d1" transform="translate(600 305) scale(0.8)"/>
      <use href="#spark" class="tw d2" transform="translate(1176 215) scale(0.6)"/>
      <use href="#spark" class="tw d2" transform="translate(24 215) scale(0.6)"/>
    </g>

    <!-- Project Manager: risol -->
    <g class="card c1" filter="url(#sh)">
      <rect x="40" y="50" width="540" height="150" rx="28" fill="#ffcf3d"/>
      <circle cx="125" cy="125" r="52" fill="#fff4d6"/>
      <g transform="translate(125 125)"><g class="bob">
        <g transform="rotate(-16)">
          <rect x="-38" y="-19" width="76" height="38" rx="18" fill="#f2a53c"/>
          <g fill="#d98425"><circle cx="-28" cy="-9" r="1.6"/><circle cx="-22" cy="10" r="1.6"/><circle cx="-4" cy="-13" r="1.6"/><circle cx="12" cy="13" r="1.6"/><circle cx="22" cy="-7" r="1.6"/><circle cx="-34" cy="3" r="1.4"/></g>
          <ellipse cx="36" cy="0" rx="6" ry="14" fill="#fff0c9"/>
          <circle cx="36" cy="-5" r="2" fill="#f08a24"/><circle cx="36" cy="4" r="2" fill="#6aa84f"/>
          <g fill="#4a2010"><circle cx="-13" cy="-3" r="2.3"/><circle cx="1" cy="-3" r="2.3"/></g>
          <path d="M-9 4 Q-6 8 -3 4" fill="none" stroke="#4a2010" stroke-width="1.8" stroke-linecap="round"/>
          <g fill="#f08a6a" fill-opacity="0.55"><circle cx="-17" cy="3" r="3"/><circle cx="5" cy="3" r="3"/></g>
        </g>
      </g></g>
      <text x="200" y="116" font-size="31" font-weight="700" fill="#7d0a10">Chika Dena</text>
      <rect x="200" y="136" width="192" height="32" rx="16" fill="#7d0a10"/>
      <text x="296" y="157" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffe9a8" text-anchor="middle" letter-spacing="1.6">PROJECT MANAGER</text>
      <text x="550" y="158" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#7d0a10" text-anchor="end">@chikadena</text>
    </g>

    <!-- Anggota 1: tahu isi -->
    <g class="card c2" filter="url(#sh)">
      <rect x="620" y="50" width="540" height="150" rx="28" fill="#fff4d6"/>
      <circle cx="705" cy="125" r="52" fill="#ffe3a0"/>
      <g transform="translate(705 125)"><g class="bob b2">
        <rect x="-30" y="-28" width="60" height="56" rx="20" fill="#e9b24f"/>
        <g fill="#cf8f2c"><circle cx="-22" cy="-14" r="1.7"/><circle cx="-20" cy="16" r="1.7"/><circle cx="22" cy="18" r="1.7"/><circle cx="24" cy="-2" r="1.7"/><circle cx="-4" cy="-22" r="1.7"/></g>
        <ellipse cx="13" cy="-14" rx="12" ry="8" fill="#fff0c9" transform="rotate(-20 13 -14)"/>
        <circle cx="10" cy="-15" r="2" fill="#f08a24"/><circle cx="17" cy="-12" r="2" fill="#6aa84f"/>
        <g fill="#4a2010"><circle cx="-11" cy="4" r="2.3"/><circle cx="3" cy="4" r="2.3"/></g>
        <path d="M-7 11 Q-4 15 -1 11" fill="none" stroke="#4a2010" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#f08a6a" fill-opacity="0.55"><circle cx="-16" cy="10" r="3"/><circle cx="8" cy="10" r="3"/></g>
      </g></g>
      <text x="780" y="116" font-size="31" font-weight="700" fill="#7d0a10">M. Firdausyah</text>
      <rect x="780" y="136" width="108" height="32" rx="16" fill="#ffcf3d"/>
      <text x="834" y="157" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7d0a10" text-anchor="middle" letter-spacing="1.6">ANGGOTA</text>
      <text x="1130" y="158" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#7d0a10" text-anchor="end">@Mfirdaus809</text>
    </g>

    <g transform="translate(0 20)">
    <!-- Anggota 2: pisang coklat -->
    <g class="card c3" filter="url(#sh)">
      <rect x="40" y="210" width="540" height="150" rx="28" fill="#fff4d6"/>
      <circle cx="125" cy="285" r="52" fill="#ffe3a0"/>
      <g transform="translate(125 285)"><g class="bob b3">
        <g transform="rotate(24)">
          <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#c27f35"/>
          <g stroke="#5b2a14" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" fill="none">
            <path d="M-31 -11 L-26 11"/><path d="M-22 -12 L-17 12"/><path d="M22 -12 L27 12"/><path d="M31 -11 L35 9"/>
          </g>
          <g fill="#4a2010"><circle cx="-7" cy="-2" r="2.1"/><circle cx="7" cy="-2" r="2.1"/></g>
          <path d="M-3.5 4 Q0 8 3.5 4" fill="none" stroke="#4a2010" stroke-width="1.7" stroke-linecap="round"/>
          <g fill="#f08a6a" fill-opacity="0.6"><circle cx="-12" cy="3" r="2.6"/><circle cx="12" cy="3" r="2.6"/></g>
        </g>
      </g></g>
      <text x="200" y="276" font-size="31" font-weight="700" fill="#7d0a10">Nazwa Dara Musyaraf</text>
      <rect x="200" y="296" width="108" height="32" rx="16" fill="#ffcf3d"/>
      <text x="254" y="317" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7d0a10" text-anchor="middle" letter-spacing="1.6">ANGGOTA</text>
      <text x="550" y="318" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#7d0a10" text-anchor="end">@nazwa-daraa</text>
    </g>

    <!-- Anggota 3: bakso goreng -->
    <g class="card c4" filter="url(#sh)">
      <rect x="620" y="210" width="540" height="150" rx="28" fill="#fff4d6"/>
      <circle cx="705" cy="285" r="52" fill="#ffe3a0"/>
      <g transform="translate(705 285)"><g class="bob b4">
        <line x1="-14" y1="-46" x2="14" y2="46" stroke="#d6ae78" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-5.6" cy="-18.4" r="15" fill="#d99a47"/><circle cx="-10" cy="-23" r="3" fill="#fff" fill-opacity="0.45"/>
        <circle cx="8.4" cy="27.6" r="15" fill="#d99a47"/><circle cx="4" cy="23" r="3" fill="#fff" fill-opacity="0.45"/>
        <circle cx="1.4" cy="4.6" r="15" fill="#e3a553"/><circle cx="-3" cy="0" r="3" fill="#fff" fill-opacity="0.45"/>
        <g fill="#4a2010"><circle cx="-3.5" cy="4" r="2"/><circle cx="6.5" cy="4" r="2"/></g>
        <path d="M-1 9 Q1.5 12 4 9" fill="none" stroke="#4a2010" stroke-width="1.6" stroke-linecap="round"/>
        <g fill="#f08a6a" fill-opacity="0.55"><circle cx="-8" cy="8" r="2.4"/><circle cx="11" cy="8" r="2.4"/></g>
      </g></g>
      <text x="780" y="276" font-size="31" font-weight="700" fill="#7d0a10">Irma Suraya</text>
      <rect x="780" y="296" width="108" height="32" rx="16" fill="#ffcf3d"/>
      <text x="834" y="317" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7d0a10" text-anchor="middle" letter-spacing="1.6">ANGGOTA</text>
      <text x="1130" y="318" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#7d0a10" text-anchor="end">@irmalgs048-coder</text>
    </g>
    </g>
  </g>
</svg>
